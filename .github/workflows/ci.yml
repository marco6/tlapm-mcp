name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Download tlapm binary
        env:
          TLABIN: ${{ runner.temp }}/tlapm
        run: |
          set -euo pipefail
          DIR="${TLABIN%/tlapm}"
          mkdir -p "$DIR"
          curl -sL -o "${DIR}/tlapm.tar.gz" \
            "https://github.com/tlaplus/tlapm/releases/download/1.6.0-pre/tlapm-1.6.0-pre-x86_64-linux-gnu.tar.gz"
          tar -xzf "${DIR}/tlapm.tar.gz" -C "$DIR"
          chmod +x "${DIR}/tlapm/bin/tlapm"
          echo "${DIR}/tlapm/bin" >> "$GITHUB_PATH"
          "${DIR}/tlapm/bin/tlapm" --version

      - name: Run tests
        run: go test -race -count=1 -v ./...
